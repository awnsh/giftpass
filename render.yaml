services:
  - type: web
    name: giftpass
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Upload wwdr.pem, signerCert.pem and signerKey.pem as Secret Files
      # in the Render dashboard; Render mounts them in /etc/secrets.
      - key: CERT_DIR
        value: /etc/secrets
      - key: ORG_NAME
        value: GiftPass
      - key: PASS_TYPE_ID
        sync: false
      - key: TEAM_ID
        sync: false
