<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="GiftPass">
  <rect width="512" height="512" rx="116" fill="#0e0e11"/>
  <!-- card behind: the Wallet stack -->
  <rect x="120" y="168" width="290" height="196" rx="30" fill="#8b9cff" transform="rotate(-9 265 266)"/>
  <!-- the pass -->
  <rect x="96" y="196" width="320" height="206" rx="32" fill="#ffffff"/>
  <!-- ribbon -->
  <rect x="184" y="196" width="40" height="206" fill="#c5f24a"/>
  <!-- bow -->
  <g fill="none" stroke="#c5f24a" stroke-width="22" stroke-linejoin="round">
    <path d="M204 192 C 170 132, 112 150, 140 186 C 152 200, 184 198, 204 192 Z"/>
    <path d="M204 192 C 238 132, 296 150, 268 186 C 256 200, 224 198, 204 192 Z"/>
