  <rect x="252" y="264" width="84" height="12" rx="6" fill="#0e0e11" opacity=".3"/>
  <g fill="#0e0e11">
    <rect x="252" y="318" width="8" height="52" rx="2"/>
    <rect x="268" y="318" width="4" height="52" rx="2"/>
    <rect x="280" y="318" width="12" height="52" rx="2"/>
    <rect x="300" y="318" width="4" height="52" rx="2"/>
    <rect x="312" y="318" width="8" height="52" rx="2"/>
    <rect x="328" y="318" width="4" height="52" rx="2"/>
    <rect x="340" y="318" width="12" height="52" rx="2"/>
    <rect x="360" y="318" width="6" height="52" rx="2"/>
    <rect x="374" y="318" width="10" height="52" rx="2"/>
  </g>
</svg>
